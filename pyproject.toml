[project]
name = "signature-detection-api"
version = "1.0.0"
description = "Document signature detection with the trained official YOLOX-Tiny model."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "numpy>=1.26,<2.3",
    "Pillow>=11,<13",
    "opencv-python-headless>=4.10,<5",
    "loguru>=0.7,<0.8",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pathspec>=0.12,<1", "ruff>=0.11,<1"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["signature_yolox", "vendor", ".uv-cache", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
